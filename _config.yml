# Site settings
title: 3D City Model Resources
email: highered@esri.ca
url: https://example.github.io
description: "by Esri Canada's Education & Research Group"
# Color settings (hex-codes without the leading hash-tag)
color:
  primary-dark: '#FFFFFF'
  text: '#000000'
  links: '#219ab3'

# Footer settings
footer: Esri Canada

# Social networks usernames
social:
  - title: twitter
    url: https://twitter.com/EsriCanada_CE
  - title: github
    url: https://github.com/EsriCanada-CE

# Build settings
markdown: kramdown
permalink: pretty

collections:
  rules:
    output: true

category_order:
  - 'Building'
  - 'Planning'
  - 'Nature'
  - 'Transport'
  - 'Recreation'
  - 'Infrastructure'
  - 'Tools'

licenses:
  - license: CC BY
    attr: 
      - https://creativecommons.org/licenses/by/4.0
  - license: CC BY-SA
    attr: 
      - https://creativecommons.org/licenses/by-sa/4.0
  - license: CC0
    attr: 
      - https://creativecommons.org/publicdomain/zero/1.0/deed.en

sources:
  - source: carla
    attr: 
      - CARLA
      - https://carla.org
      - CC BY
  - source: 0ad
    attr:
      - 0 A.D.
      - https://play0ad.com
      - "CC BY-SA"
  - source: eracoon
    attr:
      - eracoon
      - https://opengameart.org/content/suburb-asset-pt1
      - CC0
  - source: base
    attr:
      - The Base Mesh
      - https://www.thebasemesh.com
      - CC0
  - source: quaternius
    attr:
      - Quaternius
      - https://quaternius.com/
      - CC0
  - source: kenney
    attr:
      - Kenney
      - https://kenney.nl/
      - CC0
  - source: 3td
    attr:
      - Ron Kapaun/3TD Studios
      - https://opengameart.org/content/3td-harbour-pack
      - CC0
  - source: elegant_crow
    attr:
      - Elegant Crow
      - https://elegantcrow.itch.io/
      - CC0
  - source: polyhaven
    attr:
      - Poly Haven
      - https://polyhaven.com/
      - CC0
  - source: ipoly3d
    attr:
      - iPoly3D
      - https://poly.pizza/l/g00knbx5aW
      - CC0

exclude:
  - "*.jpg"
  - "*.obj"
  - "*.fbx"
  - "*.dae"
  - "*.mtl"
  - "*.cej"
  - "*.log"
  - "*.py"
  - "*.csv"
  - "*.cgb"
  - "*.gltf"
  - "*.rpk"

